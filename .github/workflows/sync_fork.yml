name: Fork Sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-main
  cancel-in-progress: false

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: github.repository == 'Breeeezever/danmu_api'
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge upstream while preserving fork workflows
        shell: bash
        run: |
          set -Eeuo pipefail

          upstream_repo="https://github.com/huangxd-/danmu_api.git"
          upstream_branch="main"
          target_branch="main"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "${upstream_repo}"
          else
            git remote add upstream "${upstream_repo}"
          fi

          git fetch --prune upstream "${upstream_branch}"

          if git merge-base --is-ancestor "upstream/${upstream_branch}" HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi

          base_head="$(git rev-parse HEAD)"
          set +e
          git merge --no-commit --no-ff "upstream/${upstream_branch}"
          merge_status=$?
          set -e

          if (( merge_status != 0 )); then
            conflicts="$(git diff --name-only --diff-filter=U)"
            non_workflow_conflicts="$(printf '%s\n' "${conflicts}" | grep -v '^\.github/workflows/' | sed '/^$/d' || true)"
            if [[ -n "${non_workflow_conflicts}" ]]; then
              echo "Non-workflow merge conflicts require manual review:" >&2
              printf '%s\n' "${non_workflow_conflicts}" >&2
              git merge --abort
              exit 1
            fi
          fi

          # GITHUB_TOKEN cannot update workflow files. Keep this fork's workflow
          # directory unchanged while merging every other upstream change.
          git rm -r --ignore-unmatch .github/workflows >/dev/null 2>&1 || true
          if git cat-file -e "${base_head}:.github/workflows" 2>/dev/null; then
            git checkout "${base_head}" -- .github/workflows
          fi
          git add -A .github/workflows

          remaining_conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${remaining_conflicts}" ]]; then
            echo "Unresolved merge conflicts:" >&2
            printf '%s\n' "${remaining_conflicts}" >&2
            git merge --abort
            exit 1
          fi

          git commit -m "Sync upstream ${upstream_branch} while preserving fork workflows"
          git push origin "HEAD:${target_branch}"
